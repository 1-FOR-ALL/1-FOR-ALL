<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>專案留言板｜新增留言（線稿）</title>
<link rel="stylesheet" href="wireframe.css">
</head>
<body>
<!-- 畫面 3／3：新增留言（編輯留言共用同一個表單）。規格見 ../SPEC.md 「3. 新增／編輯留言」 -->
<div class="app">

  <nav class="sidebar" aria-label="主選單">
    <div class="sidebar__brand"><div>1 for ALL</div><div>企業資訊入口</div></div>
    <div class="sidebar__nav">
      <a class="sidebar__link" href="list.html" aria-current="page">專案管理區</a>
    </div>
    <div class="sidebar__spacer"></div>
    <a class="sidebar__account" href="#settings">
      <span class="avatar avatar--lg">王</span><span style="flex-grow:1">王小明</span><span>設定</span>
    </a>
  </nav>

  <main class="main">
    <header class="page-header">
      <div class="page-tab"><h1>專案留言板</h1><span class="badge" aria-label="1 則被提及">1</span></div>
    </header>

    <div class="content">
      <a href="list.html">← 取消，返回列表</a>

      <form class="form" action="list.html">
        <div class="row row--between" style="padding-bottom:10px;border-bottom:1px solid #000">
          <h2 style="margin:0;font-size:18px;font-weight:400">新增留言</h2>
          <div class="meta"><span class="avatar">王</span><span>王小明</span><span>2026/11/19 14:28</span></div>
        </div>

        <label class="field">
          <span>標題（必填）</span>
          <input type="text" name="title" required placeholder="輸入留言標題" value="11/28 專案週會議程">
        </label>

        <label class="field">
          <span>內容</span>
          <textarea name="body" rows="12" placeholder="輸入內容，可用 @ 標記成員">本週週會改到 11/28（五）10:00，地點 3F 會議室 B。

議程：
1. M3 進度回報（各組 5 分鐘）
2. 客戶簡報分工確認
3. 測試環境帳號切換

@陳怡君 麻煩準備簡報進度。</textarea>
        </label>

        <!-- 已上傳附件 -->
        <div class="row" style="gap:8px">
          <span class="file-chip">[檔] M3-進度表.xlsx（86 KB）<button type="button" aria-label="移除附件 M3-進度表.xlsx">✕</button></span>
        </div>

        <div class="row row--between" style="padding-top:12px;border-top:1px solid #000">
          <div class="row" style="gap:8px">
            <button type="button" class="btn">上傳圖片</button>
            <button type="button" class="btn">上傳檔案</button>
          </div>
          <div class="row">
            <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" name="pinned">發布後置頂</label>
            <button type="submit" class="btn">送出</button>
          </div>
        </div>
      </form>
    </div>
  </main>
</div>
</body>
</html>
